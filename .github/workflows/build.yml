name: Forge 1.20.1 build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build release without QA harness
        run: chmod +x gradlew && ./gradlew clean build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: forge-1.20.1
          path: build/libs/*.jar
