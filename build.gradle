plugins {
    id 'fabric-loom' version '1.7.4'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

configurations {
    shadowInclude
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

def testParallelism = providers.gradleProperty('testParallelism').getOrElse('4')
def testRunDir = "run-gametest-${testParallelism}"

loom {
    createRemapConfigurations(sourceSets.gametest)
    mods {
        scalablelux { sourceSet sourceSets.main }
        scalablelux_gametest { sourceSet sourceSets.gametest }
    }
    runs {
        gameTest {
            server()
            source sourceSets.gametest
            runDir testRunDir
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.file('build/test-results/gametest-' + testParallelism + '.xml').absolutePath}"
        }
    }
}

tasks.register('prepareGameTestConfig') {
    doLast {
        def config = file("${testRunDir}/config/scalablelux.properties")
        config.parentFile.mkdirs()
        config.text = "parallelism=${testParallelism}\n"
        file('build/test-results').mkdirs()
    }
}

tasks.named('runGameTest') { dependsOn 'prepareGameTestConfig' }

loom.runs.all {
    // https://github.com/SpongePowered/Mixin/wiki/Mixin-Java-System-Properties
    vmArg("-Dmixin.debug=true")
}

/*
 * Gets the version name from the latest Git tag
 */
// https://stackoverflow.com/questions/28498688/gradle-script-to-autoversion-and-include-the-commit-hash-in-android
def getGitCommit = { ->
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'git', 'rev-parse', '--short', 'HEAD'
        standardOutput = stdout
//        workingDir = ".."
    }
    return stdout.toString().trim()
}

archivesBaseName = project.archives_base_name
version = project.mod_version + "+fabric." + getGitCommit()
group = project.maven_group

dependencies {
    //to change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    //mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    //modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // PSA: Some older mods, compiled on Loom 0.2.1, might have outdated Maven POMs.
    // You may need to force-disable transitiveness on them.

    shadowInclude("com.ishland.flowsched:flowsched") {
        transitive false
    }
    implementation("com.ishland.flowsched:flowsched")
    gametestImplementation sourceSets.main.output
    modGametestImplementation 'net.fabricmc.fabric-api:fabric-gametest-api-v1:1.2.12+b3afc78b77'
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft_version": minecraft_version, "loader_version": loader_version, "mod_version": mod_version
    }
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 17
}

loom {
    accessWidenerPath = file("src/main/resources/scalablelux.accesswidener")
}

// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
// if it is present.
// If you remove this task, sources will not be generated.
java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.withType(Jar).configureEach {
    from('LICENSE')
    from('FlowSched/LICENSE') {
        into 'META-INF/licenses'
        rename { 'FlowSched-MIT.txt' }
    }
    from('HARI-PORT-NOTICE.md') { into 'META-INF' }
}

shadowJar {
    archiveClassifier = "all-dev"
    configurations = [ project.configurations.shadowInclude ]

    relocate "com.ishland.flowsched", "ca.spottedleaf.starlight.interndep.flowsched"
}

remapJar {
    input = shadowJar.archiveFile
    archiveFileName = shadowJar.archiveFileName.get().replaceAll("-dev\\.jar\$", ".jar")
    addNestedDependencies = true
    dependsOn shadowJar
}

clean.dependsOn gradle.includedBuild('FlowSched').task(':clean')

// make build reproducible
tasks.withType(AbstractArchiveTask) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            // add all the jars that should be included when publishing to maven
            artifact(remapJar) {
                builtBy remapJar
            }
            artifact(sourcesJar) {
                builtBy remapSourcesJar
            }
        }
    }

    // select the repositories you want to publish to
    repositories {
        // uncomment to publish to the local maven
        // mavenLocal()
    }
}
